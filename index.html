<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2340" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wind Rush</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d2340;
        /* No pull-to-refresh, double-tap zoom, text selection or long-press callouts while playing. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        /* dvh tracks the visible area as mobile browser toolbars show and hide. */
        height: 100dvh;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        outline: none;
        touch-action: none;
      }
      /* Phones/tablets held upright: draw the landscape game rotated 90 degrees so it fills the
         screen and the player simply turns the device sideways. Must match ROTATED_QUERY in
         src/systems/MobileDisplay.js, which also remaps touches for this layout. */
      @media (orientation: portrait) and (pointer: coarse) {
        #game {
          position: fixed;
          top: 50%;
          left: 50%;
          width: 100vh;
          width: 100dvh;
          height: 100vw;
          transform: translate(-50%, -50%) rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
